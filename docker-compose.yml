services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-castracloud}
      POSTGRES_PASSWORD: ${DB_PASS:-castracloud}
      POSTGRES_DB: ${DB_NAME:-castracloud}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-castracloud}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: ["/app/api"]
    environment:
      API_PORT: "8080"
      MIGRATIONS_DIR: /app/migrations
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_TTL: ${JWT_TTL:-1h}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      DB_USER: ${DB_USER:-castracloud}
      DB_PASS: ${DB_PASS:-castracloud}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-castracloud}
      DB_SSLMODE: disable
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  # One-shot collector; run with: docker compose --profile scan run --rm cspm
  cspm:
    build: .
    command: ["/app/cspm"]
    profiles: ["scan"]
    environment:
      CSPM_PROVIDER: ${CSPM_PROVIDER:-aws}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      GCP_PROJECT: ${GCP_PROJECT:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      CSPM_API_URL: http://api:8080
      CSPM_TENANT_ID: ${CSPM_TENANT_ID:-}
      CSPM_API_TOKEN: ${CSPM_API_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      - api

  web:
    build: ./web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
